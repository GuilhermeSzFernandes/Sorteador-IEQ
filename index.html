<title>Sorteador de Números</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: uma coluna central — controles no topo, palco com as bolas, histórico de rodadas abaixo */
  :root {
    /* Tema único: claro, com detalhes em azul */
    color-scheme: light;
    --bg: #f2f6fc;
    --surface: #ffffff;
    --fg: #14213d;
    --muted: #55627d;
    --line: #d3deef;
    --accent: #1d4ed8;
    --accent-soft: #e3ecfd;
    --accent-fg: #ffffff;
    --ball: #1d4ed8;
    --ball-deep: #0f2c8a;
    --ball-light: #5b8cff;
    --ball-ink: #1d4ed8;
    --warn: #b4421d;
    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .sub { margin: 4px 0 0; color: var(--muted); }

  form.controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 100px; min-width: 0; }
  .field label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .field input {
    font: 600 1.15rem var(--font-body); font-variant-numeric: tabular-nums;
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button { font-family: var(--font-body); cursor: pointer; }
  .btn-draw {
    flex: 1 1 160px;
    font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em;
    padding: 13px 20px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-fg);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn-draw:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-draw:active:not(:disabled) { transform: scale(0.97); }
  .btn-draw:disabled { opacity: 0.55; cursor: default; }
  .btn-draw:focus-visible, .btn-ghost:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .msg { min-height: 1.5em; margin: -12px 0 0; color: var(--warn); font-weight: 500; }

  .stage {
    min-height: 200px;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 18px;
    padding: 28px 12px;
    border-radius: 18px;
    background:
      radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
      var(--surface);
    border: 1px solid var(--line);
  }
  .placeholder { color: var(--muted); text-align: center; align-self: center; }

  /* Placa azul com visor branco: cresce na largura conforme a quantidade de dígitos */
  .ball {
    --h: clamp(64px, 16vw, 84px);
    position: relative;
    height: var(--h);
    max-width: 100%;
    padding: 8px;
    border-radius: 16px;
    display: flex;
    background: linear-gradient(160deg, var(--ball-light) 0%, var(--ball) 45%, var(--ball-deep) 100%);
    box-shadow: 0 12px 24px -12px var(--ball-deep), inset 0 -4px 10px rgba(0, 0, 0, 0.18);
    animation: drop .45s cubic-bezier(.3,1.5,.6,1) both;
  }
  .ball span {
    display: grid; place-items: center;
    min-width: calc(var(--digits, 2) * 1ch + 1.1em);
    padding: 0 0.55em;
    border-radius: 10px;
    background: var(--surface);
    box-shadow: inset 0 2px 4px rgba(15, 44, 138, 0.25);
    font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: calc(var(--h) * 0.4);
    color: var(--ball-ink);
    line-height: 1;
  }
  .ball::before {
    content: ""; position: absolute; top: 3px; left: 14px; right: 14px; height: 3px;
    border-radius: 2px; background: rgba(255, 255, 255, 0.4);
  }
  .ball.rolling span { color: var(--muted); }
  .ball.rolling { animation: drop .45s cubic-bezier(.3,1.5,.6,1) both, wobble .18s ease-in-out .45s infinite alternate; }
  .ball.landed { animation: pop .42s cubic-bezier(.3,1.8,.5,1); }
  .ball.landed::after {
    content: ""; position: absolute; inset: -6px; border-radius: 20px;
    border: 3px solid var(--ball-light);
    animation: ring .7s ease-out forwards;
    pointer-events: none;
  }
  .stage.many .ball { --h: clamp(50px, 12vw, 62px); }

  @keyframes drop { from { transform: translateY(-40px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes wobble { from { transform: translateY(-3px) rotate(-1.5deg); } to { transform: translateY(3px) rotate(1.5deg); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.25, 1.5); opacity: 0; } }

  .history { display: flex; flex-direction: column; gap: 12px; }
  .history-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  .history-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; margin: 0; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn-ghost {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--fg); font-weight: 600; font-size: 0.9rem;
  }
  .btn-ghost:hover { border-color: var(--muted); }
  .btn-ghost.confirm { border-color: var(--warn); color: var(--warn); }

  ol.rounds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ol.rounds li {
    display: flex; gap: 12px; align-items: baseline;
    padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  }
  ol.rounds li.latest { border-color: var(--accent); background: var(--accent-soft); }
  ol.rounds li.latest .round-nums { color: var(--accent); }
  h1 { color: var(--accent); }
  .controls { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)) !important; }
  .round-n { flex: none; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); width: 5.5em; }
  .round-nums { min-width: 0; overflow-wrap: anywhere; font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .ball, .ball.rolling, .ball.landed { animation: none; }
    .ball.landed::after { display: none; }
  }
</style>

<div class="wrap">
  <header>
    <h1>Sorteador</h1>
    <p class="sub">Os números já sorteados não saem de novo até você recomeçar.</p>
  </header>

  <form class="controls" id="form" novalidate>
    <div class="field">
      <label for="min">De</label>
      <input id="min" type="number" inputmode="numeric" value="1" step="1">
    </div>
    <div class="field">
      <label for="max">Até</label>
      <input id="max" type="number" inputmode="numeric" value="100" step="1">
    </div>
    <div class="field">
      <label for="qty">Quantos</label>
      <input id="qty" type="number" inputmode="numeric" value="3" min="1" step="1">
    </div>
    <button class="btn-draw" id="draw" type="submit">Sortear</button>
  </form>
  <p class="msg" id="msg" role="status"></p>

  <section class="stage" id="stage" aria-live="polite">
    <p class="placeholder">Escolha o intervalo e clique em <strong>Sortear</strong>.</p>
  </section>

  <section class="history">
    <div class="history-head">
      <h2>Resultados anteriores</h2>
      <span class="count" id="count"></span>
      <button class="btn-ghost" id="reset" type="button">Recomeçar</button>
    </div>
    <ol class="rounds" id="rounds"></ol>
  </section>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const used = new Set();
  const rounds = [];
  let busy = false;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function rand(n) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return Math.floor((a[0] / 4294967296) * n);
  }

  function readRange() {
    const min = Number($("min").value), max = Number($("max").value), qty = Number($("qty").value);
    if (![min, max, qty].every(Number.isInteger)) return { error: "Use apenas números inteiros." };
    if (min > max) return { error: "O valor “De” precisa ser menor ou igual ao “Até”." };
    if (qty < 1) return { error: "A quantidade precisa ser pelo menos 1." };
    return { min, max, qty };
  }

  function usedInRange(min, max) {
    let c = 0;
    for (const v of used) if (v >= min && v <= max) c++;
    return c;
  }

  function pick(min, max, n) {
    const total = max - min + 1;
    if (total <= 2000000) {
      const pool = [];
      for (let v = min; v <= max; v++) if (!used.has(v)) pool.push(v);
      for (let i = 0; i < n; i++) {
        const j = i + rand(pool.length - i);
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, n);
    }
    const out = new Set();
    while (out.size < n) {
      const v = min + rand(total);
      if (!used.has(v)) out.add(v);
    }
    return [...out];
  }

  function roll(ball, final, min, max, duration) {
    return new Promise((resolve) => {
      const span = ball.firstChild;
      const total = max - min + 1;
      const start = performance.now();
      const tick = () => {
        const t = (performance.now() - start) / duration;
        if (t >= 1) {
          span.textContent = final;
          ball.classList.remove("rolling");
          ball.classList.add("landed");
          return resolve();
        }
        const v = min + rand(total);
        span.textContent = v;
        setTimeout(tick, 45 + t * t * 220);
      };
      tick();
    });
  }

  async function draw() {
    if (busy) return;
    const r = readRange();
    if (r.error) { $("msg").textContent = r.error; return; }
    const total = r.max - r.min + 1;
    const left = total - usedInRange(r.min, r.max);
    if (left === 0) {
      $("msg").textContent = "Todos os números desse intervalo já saíram. Clique em Recomeçar para sortear de novo.";
      return;
    }
    const n = Math.min(r.qty, left);
    $("msg").textContent = n < r.qty ? `Só restavam ${n} número${n > 1 ? "s" : ""} disponíve${n > 1 ? "is" : "l"}.` : "";

    const picks = pick(r.min, r.max, n);
    picks.forEach((v) => used.add(v));

    busy = true;
    $("draw").disabled = true;
    const stage = $("stage");
    stage.innerHTML = "";
    stage.classList.toggle("many", n > 8);
    stage.style.setProperty("--digits", Math.max(String(r.min).length, String(r.max).length));

    const balls = picks.map(() => {
      const b = document.createElement("div");
      b.className = "ball rolling";
      b.appendChild(document.createElement("span"));
      stage.appendChild(b);
      return b;
    });

    const base = reduced ? 150 : 1100;
    const step = reduced ? 60 : Math.max(120, Math.min(450, 2400 / n));
    await Promise.all(balls.map((b, i) => roll(b, picks[i], r.min, r.max, base + i * step)));

    rounds.push(picks);
    renderHistory();
    busy = false;
    $("draw").disabled = false;
  }

  function renderHistory() {
    const list = $("rounds");
    list.innerHTML = "";
    if (!rounds.length) {
      const p = document.createElement("li");
      p.className = "empty";
      p.style.cssText = "background:none;border:0;padding:0";
      p.textContent = "Nenhum sorteio ainda.";
      list.appendChild(p);
    }
    for (let i = rounds.length - 1; i >= 0; i--) {
      const li = document.createElement("li");
      if (i === rounds.length - 1) li.className = "latest";
      li.innerHTML = `<span class="round-n">Rodada ${i + 1}</span><span class="round-nums"></span>`;
      li.lastChild.textContent = rounds[i].join(", ");
      list.appendChild(li);
    }
    const r = readRange();
    if (r.error) { $("count").textContent = ""; return; }
    const total = r.max - r.min + 1;
    const left = total - usedInRange(r.min, r.max);
    $("count").textContent = `Restam ${left.toLocaleString("pt-BR")} de ${total.toLocaleString("pt-BR")}`;
  }

  let resetTimer;
  $("reset").addEventListener("click", () => {
    const btn = $("reset");
    if (!btn.classList.contains("confirm")) {
      if (!rounds.length) return;
      btn.classList.add("confirm");
      btn.textContent = "Apagar resultados?";
      resetTimer = setTimeout(() => { btn.classList.remove("confirm"); btn.textContent = "Recomeçar"; }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    btn.classList.remove("confirm");
    btn.textContent = "Recomeçar";
    used.clear();
    rounds.length = 0;
    $("msg").textContent = "";
    $("stage").innerHTML = '<p class="placeholder">Resultados apagados. Pronto para um novo sorteio.</p>';
    renderHistory();
  });

  $("form").addEventListener("submit", (e) => { e.preventDefault(); draw(); });
  ["min", "max"].forEach((id) => $(id).addEventListener("input", renderHistory));
  renderHistory();
</script>
